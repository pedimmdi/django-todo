openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: |2

    A RESTful API for managing todo lists and tasks.

    Built with:
    - Django
    - Django REST Framework
    - Simple JWT
    - drf-spectacular

    Modules:
    - Accounts
    - Profiles
    - Todo Lists
    - Tasks

    Features:
    - JWT Authentication
    - User Profile Management
    - Todo Lists CRUD
    - Tasks CRUD
    - Status and Priority Management
    - OpenAPI 3 Documentation
  contact:
    name: pedimmdi
    email: pedimmdi@gmail.com
  license:
    name: MIT License
paths:
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/accounts/login/refresh/:
    post:
      operationId: v1_accounts_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/profile/:
    get:
      operationId: v1_accounts_profile_retrieve
      description: Retrieve profile information of authenticated user.
      summary: Get current profile
      tags:
      - Profiles
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: v1_accounts_profile_update
      description: Update profile information of authenticated user.
      summary: Update current profile
      tags:
      - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
            examples:
              ProfileExample:
                value:
                  first_name: John
                  last_name: Doe
                  bio: Backend Developer
                summary: Profile Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      description: Create a new user account using email and password.
      summary: Register new user
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            examples:
              RegisterExample:
                value:
                  email: john@example.com
                  password: StrongPassword123
                summary: Register Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/todo/tasks/:
    get:
      operationId: v1_todo_tasks_list
      summary: List tasks
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
          description: ''
    post:
      operationId: v1_todo_tasks_create
      summary: Create task
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
            examples:
              TaskExample:
                value:
                  title: Learn Django
                  description: Read DRF documentation
                  todo_list: 1
                  status: 1
                  priority: 2
                summary: Task Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
  /api/v1/todo/tasks/{id}/:
    get:
      operationId: v1_todo_tasks_retrieve
      summary: Retrieve task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    put:
      operationId: v1_todo_tasks_update
      summary: Update task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskWriteRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    patch:
      operationId: v1_todo_tasks_partial_update
      summary: Partially update task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskWriteRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
          description: ''
    delete:
      operationId: v1_todo_tasks_destroy
      summary: Delete task
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/todo/todo-lists/:
    get:
      operationId: v1_todo_todo_lists_list
      summary: List todo lists
      tags:
      - Todo Lists
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoList'
          description: ''
    post:
      operationId: v1_todo_todo_lists_create
      summary: Create todo list
      tags:
      - Todo Lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoListRequest'
            examples:
              TodoListExample:
                value:
                  title: Work Tasks
                summary: Todo List Example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TodoListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TodoListRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
          description: ''
  /api/v1/todo/todo-lists/{id}/:
    get:
      operationId: v1_todo_todo_lists_retrieve
      summary: Retrieve todo list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this todo list.
        required: true
      tags:
      - Todo Lists
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
          description: ''
    put:
      operationId: v1_todo_todo_lists_update
      summary: Update todo list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this todo list.
        required: true
      tags:
      - Todo Lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TodoListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TodoListRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
          description: ''
    patch:
      operationId: v1_todo_todo_lists_partial_update
      summary: Partially update todo list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this todo list.
        required: true
      tags:
      - Todo Lists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTodoListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTodoListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTodoListRequest'
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
          description: ''
    delete:
      operationId: v1_todo_todo_lists_destroy
      summary: Delete todo list
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this todo list.
        required: true
      tags:
      - Todo Lists
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    PatchedTaskWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        todo_list:
          type: integer
        status:
          type: integer
        priority:
          type: integer
        deadline:
          type: string
          format: date-time
          nullable: true
    PatchedTodoListRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    Priority:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    Profile:
      type: object
      properties:
        user:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 255
        last_name:
          type: string
          maxLength: 255
        image:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
      required:
      - first_name
      - last_name
      - user
    ProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        image:
          type: string
          format: binary
          nullable: true
        bio:
          type: string
          nullable: true
      required:
      - first_name
      - last_name
    Status:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    TaskRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        todo_list:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/Status'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/Priority'
          readOnly: true
        deadline:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - priority
      - status
      - title
      - todo_list
      - updated_at
    TaskWriteRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        todo_list:
          type: integer
        status:
          type: integer
        priority:
          type: integer
        deadline:
          type: string
          format: date-time
          nullable: true
      required:
      - priority
      - status
      - title
      - todo_list
    TodoList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        user:
          type: integer
          readOnly: true
      required:
      - id
      - title
      - user
    TodoListRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - title
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
      required:
      - email
    UserRegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://127.0.0.1:8000
  description: Development
